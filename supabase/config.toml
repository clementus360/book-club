# For `supabase start` / `supabase db push`. Everything unspecified uses the
# CLI's defaults.
project_id = "commonplace"

[api]
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
